<html lang="ru">
<head>

<title>Парфии — Великие ароматы</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: radial-gradient(ellipse at 50% 0%, #1a1510 0%, #0a0806 60%, #050403 100%);
    color: #e8e0d4;
    font-family: 'Montserrat', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  header {
    position: fixed; top:0; left:0; right:0; z-index: 50;
    padding: 22px 48px;
    display: flex; justify-content: space-between; align-items: center;
    backdrop-filter: blur(14px);
    background: linear-gradient(to bottom, rgba(10,8,6,.85), transparent);
  }
  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px; letter-spacing: 8px;
    color: #d4af6a; font-weight: 600;
  }
  nav a {
    color: #a89f92; text-decoration: none;
    margin-left: 34px; font-size: 11px;
    letter-spacing: 2px; text-transform: uppercase;
    transition: color .3s;
  }
  nav a:hover { color: #d4af6a; }

  .hero {
    position: relative; z-index: 2;
    min-height: 70vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 160px 24px 40px;
  }
  .hero h1 {
    font-family:'Cormorant Garamond',serif;
    font-size: clamp(48px, 10vw, 120px);
    font-weight: 300; letter-spacing: 20px;
    color: #e8d9b0;
    text-shadow: 0 0 60px rgba(212,175,106,.4);
    animation: titleIn 1.6s cubic-bezier(.2,.7,.3,1) both;
    padding-left: 20px;
  }
  .hero p {
    margin-top: 24px;
    font-size: 12px; letter-spacing: 6px;
    text-transform: uppercase; color: #a89f92;
    animation: titleIn 1.6s .3s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes titleIn {
    from { opacity:0; transform: translateY(30px); filter: blur(10px); }
    to   { opacity:1; transform: translateY(0); filter: blur(0); }
  }

  .perfume-section {
    position: relative; z-index: 2;
    max-width: 1200px;
    margin: 0 auto 120px;
    padding: 0 32px;
    display: grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 60px;
    align-items: center;
    opacity: 0; transform: translateY(60px);
    transition: all 1s cubic-bezier(.2,.7,.3,1);
  }
  .perfume-section.visible { opacity:1; transform: translateY(0); }

  .canvas-wrap {
    position: relative;
    height: 480px;
    display: flex; align-items: center; justify-content: center;
    cursor: grab;
  }
  .canvas-wrap:active { cursor: grabbing; }
  .canvas-wrap canvas {
    display: block;
    filter: drop-shadow(0 30px 40px rgba(0,0,0,.7));
  }
  .canvas-wrap .error-msg {
    color: #a89f92; font-size: 12px; letter-spacing: 2px;
    text-align: center; line-height: 1.8;
    border: 1px solid rgba(212,175,106,.2);
    padding: 24px; border-radius: 4px;
  }

  .info h2 {
    font-family:'Cormorant Garamond',serif;
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 300; letter-spacing: 4px;
    color: #e8c987;
    margin-bottom: 8px;
  }
  .info .brand-line {
    font-size: 11px; letter-spacing: 5px;
    text-transform: uppercase; color: #a89f92;
    margin-bottom: 28px;
  }
  .info .desc {
    font-size: 14px; line-height: 1.9;
    color: #b5ab9c; font-weight: 300;
    margin-bottom: 32px;
  }

  .detail-block { margin-bottom: 24px; }
  .detail-label {
    font-size: 10px; letter-spacing: 4px;
    text-transform: uppercase; color: #d4af6a;
    margin-bottom: 8px;
  }
  .pyramid-mini { display: flex; flex-direction: column; gap: 10px; }
  .pyr-row {
    display: flex; gap: 16px; align-items: baseline;
    padding-left: 16px;
    border-left: 1px solid rgba(212,175,106,.3);
  }
  .pyr-row .lbl {
    font-size: 9px; letter-spacing: 3px;
    text-transform: uppercase; color: #8a8176;
    min-width: 70px;
  }
  .pyr-row .val {
    font-family:'Cormorant Garamond',serif;
    font-size: 17px; color: #e8e0d4; font-weight: 300;
  }

  .stats {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 20px; margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid rgba(212,175,106,.12);
  }
  .stat .s-label {
    font-size: 9px; letter-spacing: 3px;
    text-transform: uppercase; color: #8a8176;
    margin-bottom: 6px;
  }
  .stat .s-value {
    font-size: 13px; color: #d4af6a; letter-spacing: 1px;
  }

  .divider {
    position: relative; z-index: 2;
    width: 1px; height: 80px;
    background: linear-gradient(to bottom, transparent, rgba(212,175,106,.4), transparent);
    margin: 0 auto;
  }

  footer {
    position: relative; z-index: 2;
    text-align:center; padding: 50px 20px;
    font-size: 11px; letter-spacing: 3px;
    color: #5a5248;
    border-top: 1px solid rgba(212,175,106,.08);
  }

  @media (max-width: 900px) {
    .perfume-section {
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 80px;
      padding: 0 20px;
    }

    header { padding: 16px 22px; }
    nav a { margin-left: 16px; font-size: 9px; }
    .logo { font-size: 20px; letter-spacing: 4px; }
    .hero { padding-top: 130px; min-height: 60vh; }
  }
</style>

// ===== 3D =====
const scenes = [];

function createBottle(container, colorGlass, colorLiquid) {
  const width = container.clientWidth || 400;
  const height = container.clientHeight || 480;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
  camera.position.set(0, 0.3, 7);

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch (e) {
    container.innerHTML = '<div class="error-msg">WebGL не поддерживается браузером.<br>Открой в Chrome / Edge / Firefox.</div>';
    return null;
  }
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  container.appendChild(renderer.domElement);

  // Освещение
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));

  const key = new THREE.DirectionalLight(0xfff0d0, 2.5);
  key.position.set(3, 5, 4);
  scene.add(key);

  const rim = new THREE.DirectionalLight(0x88aaff, 1.8);
  rim.position.set(-4, 2, -3);
  scene.add(rim);

  const bottom = new THREE.PointLight(0xd4af6a, 2, 10);
  bottom.position.set(0, -3, 2);
  scene.add(bottom);

  // Группа
  const group = new THREE.Group();
  scene.add(group);

  // Стекло
  const glassMat = new THREE.MeshPhysicalMaterial({
    color: colorGlass,
    metalness: 0.05,
    roughness: 0.08,
    transmission: 0.92,
    thickness: 1.2,
    ior: 1.5,
    clearcoat: 1,
    clearcoatRoughness: 0.1,
    transparent: true,
    opacity: 0.9,
    side: THREE.DoubleSide
  });

  // Корпус — скруглённый бокс (через RoundedBox-like подход)
  const bodyGeo = new THREE.BoxGeometry(1.6, 2.2, 0.9, 12, 12, 6);
  // Скругление
  const pos = bodyGeo.attributes.position;
  const r = 0.18;
  for (let i = 0; i < pos.count; i++) {
    let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const hx = 0.8, hy = 1.1, hz = 0.45;
    // clamp к скруглённому боксу
    const cx = Math.max(-hx + r, Math.min(hx - r, x));
    const cy = Math.max(-hy + r, Math.min(hy - r, y));
    const cz = Math.max(-hz + r, Math.min(hz - r, z));
    const dx = x - cx, dy = y - cy, dz = z - cz;
    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
    if (dist > 0.0001) {
      pos.setX(i, cx + dx / dist * r);
      pos.setY(i, cy + dy / dist * r);
      pos.setZ(i, cz + dz / dist * r);
    }
  }
  bodyGeo.computeVertexNormals();

  const body = new THREE.Mesh(bodyGeo, glassMat);
  body.position.y = -0.3;
  group.add(body);

  // Жидкость
  const liquidMat = new THREE.MeshPhysicalMaterial({
    color: colorLiquid,
    metalness: 0,
    roughness: 0.25,
    transmission: 0.5,
    thickness: 1,
    transparent: true,
    opacity: 0.9
  });
  const liquidGeo = new THREE.BoxGeometry(1.4, 1.5, 0.72);
  const liquid = new THREE.Mesh(liquidGeo, liquidMat);
  liquid.position.y = -0.75;
  group.add(liquid);

  // Крышка (золото)
  const goldMat = new THREE.MeshPhysicalMaterial({
    color: 0xd4af6a,
    metalness: 1,
    roughness: 0.18,
    clearcoat: 1,
    clearcoatRoughness: 0.1
  });
  const capGeo = new THREE.CylinderGeometry(0.45, 0.5, 0.7, 32);
  const cap = new THREE.Mesh(capGeo, goldMat);
  cap.position.y = 1.35;
  group.add(cap);

  // Кольцо
  const ringGeo = new THREE.TorusGeometry(0.5, 0.045, 16, 40);
  const ring = new THREE.Mesh(ringGeo, goldMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = 1.0;
  group.add(ring);

  // Этикетка (тёмная пластина)
  const labelMat = new THREE.MeshPhysicalMaterial({
    color: 0x0a0806,
    metalness: 0.3,
    roughness: 0.4
  });
  const labelGeo = new THREE.PlaneGeometry(0.9, 0.6);
  const label = new THREE.Mesh(labelGeo, labelMat);
  label.position.set(0, -0.3, 0.46);
  group.add(label);

  // Золотые полоски на этикетке
  const stripMat = new THREE.MeshPhysicalMaterial({
    color: 0xd4af6a, metalness: 1, roughness: 0.2
  });
  const stripTop = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.02, 0.01), stripMat);
  stripTop.position.set(0, 0.02, 0.47);
  group.add(stripTop);
  const stripBot = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.02, 0.01), stripMat);
  stripBot.position.set(0, -0.62, 0.47);
  group.add(stripBot);

  // Тень-отражение
  const shadowMat = new THREE.MeshBasicMaterial({
    color: 0xd4af6a, transparent: true, opacity: 0.15
  });
  const shadowGeo = new THREE.CircleGeometry(1.2, 32);
  const shadow = new THREE.Mesh(shadowGeo, shadowMat);
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = -1.8;
  group.add(shadow);

  group.rotation.y = -0.3;

  const state = {
    scene, camera, renderer, group,
    container,
    autoRotate: true,
    isDragging: false,
    velocity: 0
  };
  scenes.push(state);

  // Drag
  let prevX = 0;

  container.addEventListener('mousedown', (e) => {
    state.isDragging = true;
    prevX = e.clientX;
    state.velocity = 0;
  });
  window.addEventListener('mouseup', () => { state.isDragging = false; });
  window.addEventListener('mousemove', (e) => {
    if (!state.isDragging) return;
    const dx = e.clientX - prevX;
    prevX = e.clientX;
    state.velocity = dx * 0.01;
    group.rotation.y += state.velocity;
  });

  container.addEventListener('touchstart', (e) => {
    state.isDragging = true;
    prevX = e.touches[0].clientX;
    state.velocity = 0;
  });
  window.addEventListener('touchend', () => { state.isDragging = false; });
  window.addEventListener('touchmove', (e) => {
    if (!state.isDragging) return;
    const dx = e.touches[0].clientX - prevX;
    prevX = e.touches[0].clientX;
    state.velocity = dx * 0.01;
    group.rotation.y += state.velocity;
  });

  return state;
}

// Инициализация
function initScenes() {
  perfumes.forEach((p, idx) => {
    const container = document.getElementById(`canvas-${idx}`);
    if (container) {
      createBottle(container, p.color, p.liquid);
    }
  });
}

// Ждём, пока DOM отрисуется и контейнеры получат размеры
requestAnimationFrame(() => {
  setTimeout(initScenes, 50);
});

// Анимация
let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time += 0.01;
  scenes.forEach((s, i) => {
    if (s.autoRotate && !s.isDragging) {
      s.group.rotation.y += 0.006;
    }
    s.group.position.y = Math.sin(time + i) * 0.08;
    s.group.rotation.x = Math.sin(time * 0.5 + i) * 0.05;
    s.renderer.render(s.scene, s.camera);
  });
}
animate();

// Resize
window.addEventListener('resize', () => {
  scenes.forEach(s => {
    const w = s.container.clientWidth;
    const h = s.container.clientHeight;
    if (w === 0 || h === 0) return;
    s.camera.aspect = w / h;
    s.camera.updateProjectionMatrix();
    s.renderer.setSize(w, h);
  });
});

// Появление при скролле
const obs = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      obs.unobserve(e.target);
    }
  });
}, { threshold: 0.1 });

document.querySelectorAll('.perfume-section').forEach(el => obs.observe(el));
</script>
